name: mobile

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - "packages/policy-schema/**"
      - "packages/design-tokens/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - "packages/policy-schema/**"
      - "packages/design-tokens/**"
      - "pnpm-lock.yaml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter guardian-mobile lint
      - run: pnpm --filter guardian-mobile typecheck
      - run: pnpm --filter guardian-mobile test --runInBand
