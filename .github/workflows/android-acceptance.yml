name: Android acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-acceptance.yml'
      - 'apps/mobile/**'
      - 'backend/**'
      - 'packages/**'
      - 'scripts/**'
      - '.nvmrc'
      - '.python-version'
      - '.uv-version'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-acceptance.yml'
      - 'apps/mobile/**'
      - 'backend/**'
      - 'packages/**'
      - 'scripts/**'
      - '.nvmrc'
      - '.python-version'
      - '.uv-version'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: android-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GUARDIAN_ENVIRONMENT: test
  GUARDIAN_DATABASE_URL: postgresql+asyncpg://guardian:guardian@localhost:5432/guardian
  GUARDIAN_JWT_SECRET: acceptance-only-secret-with-at-least-32-bytes

jobs:
  android-public-checks:
    name: Fork-safe host, backend, Kotlin, and debug APK checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_DB: guardian
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.1'
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          version: 0.7.9
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize task-isolated Android and Gradle roots
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_sdk="${ANDROID_HOME:?Runner SDK is required only to bootstrap the task SDK}"
          sdk_root="$RUNNER_TEMP/guardian-android-sdk"
          android_user_home="$RUNNER_TEMP/guardian-android-user"
          bootstrap_sdkmanager="$bootstrap_sdk/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$sdk_root" "$android_user_home" "$RUNNER_TEMP/guardian-gradle" "$RUNNER_TEMP/guardian-avd"
          test -x "$bootstrap_sdkmanager"
          ANDROID_USER_HOME="$android_user_home" "$bootstrap_sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          ANDROID_USER_HOME="$android_user_home" "$bootstrap_sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_USER_HOME=$android_user_home"
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/guardian-avd"
            echo "GRADLE_USER_HOME=$RUNNER_TEMP/guardian-gradle"
          } >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Install pinned Android SDK, platform, build tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          test "$(awk -F' = ' '/Pkg.Revision/{print $2}' "$ANDROID_HOME/ndk/27.1.12297006/source.properties")" = "27.1.12297006"
      - name: Install locked JavaScript and backend environments
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory backend --locked --extra dev
      - name: Dependency audits record non-final release blockers
        id: dependency_audit
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/android-acceptance
          mkdir -p "$evidence"
          requirements="$RUNNER_TEMP/guardian-backend-requirements.txt"
          uv export --directory backend --locked --no-hashes --no-emit-project --format requirements-txt > "$requirements"
          set +e
          pnpm audit --prod --audit-level=high --json > "$evidence/dependency-audit.json" 2> "$evidence/dependency-audit.stderr.txt"
          node_audit_status=$?
          uvx --from pip-audit==2.9.0 pip-audit --format json --requirement "$requirements" \
            > "$evidence/backend-dependency-audit.json" 2> "$evidence/backend-dependency-audit.stderr.txt"
          backend_audit_status=$?
          set -e
          printf 'pnpm=%s\nbackend=%s\n' "$node_audit_status" "$backend_audit_status" > "$evidence/dependency-audit.exit-codes"
          findings="$(NODE_AUDIT_STATUS="$node_audit_status" BACKEND_AUDIT_STATUS="$backend_audit_status" node - "$evidence/dependency-audit.json" "$evidence/backend-dependency-audit.json" <<'NODE'
          const fs = require('node:fs');
          const [nodePath, backendPath] = process.argv.slice(2);
          const readJson = (path, label) => {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (error) {
              throw new Error(`${label} audit did not produce valid JSON: ${error.message}`);
            }
          };
          const nodeAudit = readJson(nodePath, 'pnpm');
          if (!nodeAudit || Array.isArray(nodeAudit) || nodeAudit.error || !nodeAudit.metadata?.vulnerabilities) {
            throw new Error('pnpm audit returned an infrastructure or audit-command error');
          }
          const nodeFindings = ['high', 'critical'].reduce(
            (total, severity) => total + Number(nodeAudit.metadata.vulnerabilities[severity] || 0),
            0,
          );
          const backendAudit = readJson(backendPath, 'pip-audit');
          if (!Array.isArray(backendAudit)) {
            throw new Error('pip-audit returned an infrastructure or audit-command error');
          }
          const backendFindings = backendAudit.reduce(
            (total, dependency) => total + (Array.isArray(dependency.vulns) ? dependency.vulns.length : 0),
            0,
          );
          const nodeStatus = Number(process.env.NODE_AUDIT_STATUS);
          const backendStatus = Number(process.env.BACKEND_AUDIT_STATUS);
          if (nodeStatus > 1 || backendStatus > 1 || (nodeStatus === 1 && nodeFindings === 0) || (backendStatus === 1 && backendFindings === 0)) {
            throw new Error('dependency audit command failed without a validated vulnerability finding');
          }
          process.stdout.write(String(nodeFindings + backendFindings));
          NODE
          )"
          printf 'release_admission=%s\nnode_high_or_critical_findings=%s\nbackend_findings=%s\n' \
            "$([ "$findings" -gt 0 ] && echo BLOCKED || echo NOT_BLOCKED)" \
            "$(node -e "const a=require(process.argv[1]); console.log((a.metadata.vulnerabilities.high || 0) + (a.metadata.vulnerabilities.critical || 0))" "$evidence/dependency-audit.json")" \
            "$(node -e "const a=require(process.argv[1]); console.log(a.reduce((n, d) => n + (Array.isArray(d.vulns) ? d.vulns.length : 0), 0))" "$evidence/backend-dependency-audit.json")" \
            > "$evidence/dependency-audit.release-status.txt"
          if [ "$findings" -gt 0 ]; then
            printf '%s\n' \
              'NON-FINAL RELEASE BLOCKER: dependency audit findings require remediation before release.' \
              'This debug APK and emulator acceptance evidence is not release-ready.' \
              > "$evidence/dependency-audit.release-blocker.txt"
            echo 'NON-FINAL RELEASE BLOCKER: dependency audit findings were recorded; debug/emulator acceptance continues as non-final evidence.' >> "$GITHUB_STEP_SUMMARY"
            echo 'release_blocked=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release_blocked=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Scan tracked sources for committed private secrets
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/android-acceptance
          if git grep -nI -E '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})' -- . ':(exclude)backend/.env.example' ':(exclude)apps/mobile/.env.example' > "$evidence/secret-scan.matches.txt"; then
            cat "$evidence/secret-scan.matches.txt"
            exit 1
          fi
          printf '%s\n' "No configured high-confidence private-secret patterns found in tracked sources." > "$evidence/secret-scan.passed.txt"
      - name: Host and mobile checks
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter guardian-mobile lint
          pnpm --filter guardian-mobile typecheck
          pnpm --filter guardian-mobile exec jest --runInBand
          pnpm --filter guardian-mobile test:release-admission
      - name: Backend and OpenAPI checks without a policy seed
        shell: bash
        run: |
          set -euo pipefail
          uv run --directory backend alembic upgrade head
          uv run --directory backend ruff check app tests
          uv run --directory backend mypy app
          uv run --directory backend pytest
          pnpm check:openapi
          git diff --exit-code -- packages/api-client/src/generated.ts
      - name: Kotlin policy unit tests and acceptance debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :guardian-protection:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Record public-build APK and security evidence
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          evidence=artifacts/android-acceptance
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$apk"
          cp "$apk" "$evidence/app-debug.apk"
          sha256sum "$apk" | tee "$evidence/app-debug.apk.sha256"
          "$aapt" dump badging "$apk" | tee "$evidence/app-debug.badging.txt"
          "$aapt" dump permissions "$apk" | tee "$evidence/app-debug.permissions.txt"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$evidence/app-debug.manifest.xmltree.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$evidence/app-debug.apksigner.txt"
          for permission in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_SMS RECEIVE_SMS SEND_SMS READ_CONTACTS RECORD_AUDIO QUERY_ALL_PACKAGES MANAGE_EXTERNAL_STORAGE; do
            if rg -F "android.permission.$permission" "$evidence/app-debug.permissions.txt"; then
              echo "Prohibited permission android.permission.$permission is present." >&2
              exit 1
            fi
          done
          python - "$evidence/app-debug.manifest.xmltree.txt" <<'PY'
          import re, sys
          components, current = [], None
          for line in open(sys.argv[1], encoding="utf-8"):
            start = re.match(r"^\s*E: (activity|service|receiver|provider)\b", line)
            if start:
                if current:
                    components.append(current)
                current = {"kind": start.group(1), "name": None, "exported": None}
            elif current and "android:name" in line:
                match = re.search(r'Raw: "([^"]+)"', line)
                if match:
                    current["name"] = match.group(1)
            elif current and "android:exported" in line:
                current["exported"] = "0xffffffff" in line or 'Raw: "true"' in line
          if current:
              components.append(current)
          required = {
              "MainActivity": True,
              "GuardianBootReceiver": True,
              "GuardianAccessibilityService": True,
              "GuardianNotificationListenerService": True,
              "GuardianVpnService": False,
              "GuardianBlockActivity": False,
          }
          for suffix, expected in required.items():
              matches = [item for item in components if (item["name"] or "").endswith(suffix)]
              if not matches or {item["exported"] for item in matches} != {expected}:
                  raise SystemExit(f"Unexpected exported state for {suffix}: {matches}")
          allowed_exported = {
              ("activity", "MainActivity"),
              ("receiver", "GuardianBootReceiver"),
              ("service", "GuardianAccessibilityService"),
              ("service", "GuardianNotificationListenerService"),
          }
          unexpected = [
              item
              for item in components
              if item["exported"]
              and not any(
                  item["kind"] == kind and (item["name"] or "").endswith(suffix)
                  for kind, suffix in allowed_exported
              )
          ]
          if unexpected:
              raise SystemExit(f"Unexpected exported components: {unexpected}")
          print("Guardian exported-component allowlist verified")
          PY
          raw_sources=apps/mobile/modules/guardian-protection/android/src/main
          accessibility_handler="$raw_sources/java/expo/modules/guardianprotection/accessibility/GuardianAccessibilityService.kt"
          notification_handler="$raw_sources/java/expo/modules/guardianprotection/communication/GuardianNotificationListenerService.kt"
          consent_store="$raw_sources/java/expo/modules/guardianprotection/content/ContentSafetyConsentStore.kt"
          rg -n -i '(Log\.[vdiwe]|println|putString|putStringSet|SharedPreferences)' \
            "$accessibility_handler" "$notification_handler" \
            > "$evidence/raw-input-handler-sinks.txt" || true
          if grep -vF 'Log.d("GuardianBudget", "budget_tick")' "$evidence/raw-input-handler-sinks.txt" | grep -q .; then
            cat "$evidence/raw-input-handler-sinks.txt"
            echo "Raw accessibility or notification text handler has a prohibited sink." >&2
            exit 1
          fi
          if rg -n '(putString|putStringSet|Log\.[vdiwe]|println)' "$consent_store"; then
            echo "Consent storage must not retain raw content text." >&2
            exit 1
          fi
          rg -n '(putBoolean|ACCESSIBILITY_CONTENT_CONSENT)' "$consent_store" \
            > "$evidence/consent-boolean-storage.txt"
          rg -n '(node\.text|node\.contentDescription|android\.text|Notification text is transient)' \
            "$accessibility_handler" "$notification_handler" \
            > "$evidence/raw-input-acquisition.txt"
          rg -F 'never persists Accessibility text' \
            "$accessibility_handler" \
            > "$evidence/raw-content-accessibility-contract.txt"
          rg -F 'Never log, bridge, or retain it.' \
            "$notification_handler" \
            > "$evidence/raw-content-notification-contract.txt"
          printf '%s\n' "No raw notification/accessibility text sink found; consent storage is explicitly boolean-only and discard contracts are retained." > "$evidence/raw-content-leakage-check.txt"
      - name: Upload security-blocker evidence
        if: failure() || steps.dependency_audit.outputs.release_blocked == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-acceptance-security-blocker
          path: artifacts/android-acceptance/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload fork-safe debug APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-public-check-debug-apk
          path: artifacts/android-acceptance/
          if-no-files-found: error
          retention-days: 14

  trusted-api35-acceptance:
    name: Trusted API 35 primary and child acceptance
    needs: android-public-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_DB: guardian
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.1'
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          version: 0.7.9
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize task-isolated Android and Gradle roots
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_sdk="${ANDROID_HOME:?Runner SDK is required only to bootstrap the task SDK}"
          sdk_root="$RUNNER_TEMP/guardian-android-sdk"
          android_user_home="$RUNNER_TEMP/guardian-android-user"
          bootstrap_sdkmanager="$bootstrap_sdk/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$sdk_root" "$android_user_home" "$RUNNER_TEMP/guardian-gradle" "$RUNNER_TEMP/guardian-avd"
          test -x "$bootstrap_sdkmanager"
          ANDROID_USER_HOME="$android_user_home" "$bootstrap_sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          ANDROID_USER_HOME="$android_user_home" "$bootstrap_sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_USER_HOME=$android_user_home"
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/guardian-avd"
            echo "GRADLE_USER_HOME=$RUNNER_TEMP/guardian-gradle"
          } >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
      - name: Install trusted-build and API 35 emulator SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "emulator" "system-images;android-35;google_apis;x86_64"
          test "$(awk -F' = ' '/Pkg.Revision/{print $2}' "$ANDROID_HOME/ndk/27.1.12297006/source.properties")" = "27.1.12297006"
      - name: Install locked dependencies for instrumentation
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory backend --locked --extra dev
      - name: Build map-matched APK and start matching backend
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/trusted-acceptance
          seed="$RUNNER_TEMP/guardian-policy-seed"
          trust_map="$RUNNER_TEMP/guardian-policy-trust-map.json"
          key_id=guardian-ci-2026
          cleanup() {
            rm -f "$seed" "$trust_map"
          }
          trap cleanup EXIT
          mkdir -p "$evidence" artifacts/emulator
          SEED_PATH="$seed" TRUST_MAP_PATH="$trust_map" EVIDENCE_PATH="$evidence" KEY_ID="$key_id" \
            uv run --directory backend python - <<'PY'
          import base64, hashlib, json, os, secrets
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          seed_path = Path(os.environ["SEED_PATH"])
          trust_path = Path(os.environ["TRUST_MAP_PATH"])
          evidence = Path(os.environ["EVIDENCE_PATH"])
          key_id = os.environ["KEY_ID"]
          seed_path.write_bytes(base64.b64encode(secrets.token_bytes(32)))
          os.chmod(seed_path, 0o600)
          public = Ed25519PrivateKey.from_private_bytes(base64.b64decode(seed_path.read_bytes())).public_key()
          public_b64 = base64.b64encode(public.public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode("ascii")
          trust_map = json.dumps({key_id: public_b64}, separators=(",", ":"))
          trust_path.write_text(trust_map, encoding="utf-8")
          evidence_trust_path = evidence / "policy-public-trust-map.json"
          evidence_trust_path.write_bytes(trust_path.read_bytes())
          (evidence / "policy-key-id.txt").write_text(key_id + "\n", encoding="utf-8")
          (evidence / "policy-public-trust-map.sha256").write_text(
              f"{hashlib.sha256(evidence_trust_path.read_bytes()).hexdigest()}  {evidence_trust_path.name}\n", encoding="utf-8"
          )
          PY
          (cd "$evidence" && sha256sum -c policy-public-trust-map.sha256)
          test "$(stat -c '%a' "$seed")" = 600
          export GUARDIAN_POLICY_KEY_ID="$key_id"
          export GUARDIAN_POLICY_TRUSTED_PUBLIC_KEYS="$(< "$trust_map")"
          GUARDIAN_POLICY_PRIVATE_KEY="$(< "$seed")" uv run --directory backend alembic upgrade head
          (cd apps/mobile/android && ./gradlew :guardian-protection:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace)
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$apk"
          cp "$apk" "$evidence/app-debug.apk"
          sha256sum "$apk" | tee "$evidence/app-debug.apk.sha256"
          "$aapt" dump badging "$apk" | tee "$evidence/app-debug.badging.txt"
          "$aapt" dump permissions "$apk" | tee "$evidence/app-debug.permissions.txt"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$evidence/app-debug.manifest.xmltree.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$evidence/app-debug.apksigner.txt"
          public_key="$(python -c "import json; print(next(iter(json.load(open('$trust_map')).values())))")"
          matches="$evidence/policy-public-key-in-apk.txt"
          : > "$matches"
          found=0
          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -F -- "$public_key" >> "$matches"; then
              found=1
            fi
          done < <(unzip -Z1 "$apk" | sed -nE '/^classes[0-9]*\.dex$/p')
          if [ "$found" -ne 1 ]; then
            echo "Compiled APK does not contain the exact trusted public key." >&2
            exit 1
          fi
          GUARDIAN_POLICY_PRIVATE_KEY="$(< "$seed")" \
            uv run --directory backend uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > artifacts/emulator/backend.log 2>&1 &
          echo "$!" > artifacts/emulator/backend.pid
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8000/health; do sleep 2; done' \
            | tee artifacts/emulator/backend-health.txt
          curl -fsS http://127.0.0.1:8000/v1/policy/public-key \
            > "$evidence/backend-policy-public-key.json"
          KEY_ID="$key_id" TRUST_MAP_PATH="$trust_map" BACKEND_KEY_PATH="$evidence/backend-policy-public-key.json" \
            python - <<'PY'
          import json, os
          expected = json.load(open(os.environ["TRUST_MAP_PATH"], encoding="utf-8"))
          actual = json.load(open(os.environ["BACKEND_KEY_PATH"], encoding="utf-8"))
          key_id = os.environ["KEY_ID"]
          if actual.get("key_id") != key_id or actual.get("public_key") != expected.get(key_id) or actual.get("trusted_public_keys") != expected:
              raise SystemExit("Backend policy key response does not exactly match the compiled APK trust map")
          PY
          rm -f "$seed"
      - name: Create exact primary and child API 35 AVDs
        shell: bash
        run: |
          set -euo pipefail
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo no | "$avdmanager" create avd --force --name guardian-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_5"
          echo no | "$avdmanager" create avd --force --name guardian-api35-child --package "system-images;android-35;google_apis;x86_64" --device "pixel_5"
      - name: Boot primary, install, and launch non-final debug APK
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          emulator -avd guardian-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > artifacts/emulator/guardian-api35.emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb shell getprop ro.build.fingerprint | tee artifacts/emulator/guardian-api35.boot.txt
          adb install -r artifacts/trusted-acceptance/app-debug.apk | tee artifacts/emulator/guardian-api35.install.txt
          adb shell am start -W -n com.guardian.family/.MainActivity | tee artifacts/emulator/guardian-api35.launch.txt
          adb shell pidof com.guardian.family | tee artifacts/emulator/guardian-api35.pid.txt
          adb emu kill
          timeout 90 bash -c 'until ! adb get-state >/dev/null 2>&1; do sleep 2; done'
      - name: Boot child, install, launch, and run connected instrumentation
        shell: bash
        run: |
          set -euo pipefail
          emulator -avd guardian-api35-child -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > artifacts/emulator/guardian-api35-child.emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb shell getprop ro.build.fingerprint | tee artifacts/emulator/guardian-api35-child.boot.txt
          adb install -r artifacts/trusted-acceptance/app-debug.apk | tee artifacts/emulator/guardian-api35-child.install.txt
          adb shell am start -W -n com.guardian.family/.MainActivity | tee artifacts/emulator/guardian-api35-child.launch.txt
          adb shell pidof com.guardian.family | tee artifacts/emulator/guardian-api35-child.pid.txt
          (cd apps/mobile/android && ./gradlew :guardian-protection:connectedDebugAndroidTest --no-daemon --stacktrace) | tee artifacts/emulator/guardian-api35-child.connectedDebugAndroidTest.txt
      - name: Capture emulator logs and instrumentation reports
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/emulator
          adb logcat -d -t 1000 > artifacts/emulator/logcat.txt || true
          cp -R apps/mobile/modules/guardian-protection/android/build/reports/androidTests artifacts/emulator/androidTest-reports 2>/dev/null || true
      - name: Upload API 35 emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-api35-emulator-acceptance
          path: |
            artifacts/trusted-acceptance/
            artifacts/emulator/
          if-no-files-found: warn
          retention-days: 14
