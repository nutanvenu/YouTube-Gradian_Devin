name: Android acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-acceptance.yml'
      - 'apps/mobile/**'
      - 'backend/**'
      - 'packages/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-acceptance.yml'
      - 'apps/mobile/**'
      - 'backend/**'
      - 'packages/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: android-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GUARDIAN_ENVIRONMENT: test
  GUARDIAN_DATABASE_URL: postgresql+asyncpg://guardian:guardian@localhost:5432/guardian
  GUARDIAN_JWT_SECRET: acceptance-only-secret-with-at-least-32-bytes

jobs:
  android-acceptance:
    name: Host, backend, Kotlin, and debug APK
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: guardian
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.0
        with:
          version: 0.7.9
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          test "$(awk -F' = ' '/Pkg.Revision/{print $2}' \
            "$ANDROID_HOME/ndk/27.1.12297006/source.properties")" = "27.1.12297006"
      - name: Generate ephemeral acceptance policy key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import json
          import secrets
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          key_id = "guardian-ci-2026"
          private_key = base64.b64encode(secrets.token_bytes(32)).decode("ascii")
          public_key = Ed25519PrivateKey.from_private_bytes(
              base64.b64decode(private_key)
          ).public_key().public_bytes(
              serialization.Encoding.Raw, serialization.PublicFormat.Raw
          )
          trusted_keys = json.dumps(
              {key_id: base64.b64encode(public_key).decode("ascii")}, separators=(",", ":")
          )
          print(f"GUARDIAN_POLICY_KEY_ID={key_id}")
          print(f"GUARDIAN_POLICY_PRIVATE_KEY={private_key}")
          print(f"GUARDIAN_POLICY_TRUSTED_PUBLIC_KEYS={trusted_keys}")
          PY
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Host and mobile checks
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter guardian-mobile lint
          pnpm --filter guardian-mobile typecheck
          pnpm --filter guardian-mobile exec jest --runInBand
          pnpm --filter guardian-mobile test:release-admission
      - name: Backend and OpenAPI checks
        run: |
          set -euo pipefail
          uv sync --directory backend --locked --extra dev
          uv run --directory backend alembic upgrade head
          uv run --directory backend ruff check app tests
          uv run --directory backend mypy app
          uv run --directory backend pytest
          pnpm check:openapi
          git diff --exit-code -- packages/api-client/src/generated.ts
      - name: Kotlin policy unit tests and acceptance debug APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew :guardian-protection:testDebugUnitTest :app:assembleDebug \
            --no-daemon --stacktrace
      - name: Record debug APK manifest and hash evidence
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          evidence="artifacts/android-acceptance"
          test -s "$apk"
          mkdir -p "$evidence"
          cp "$apk" "$evidence/app-debug.apk"
          sha256sum "$apk" | tee "$evidence/app-debug.apk.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | tee "$evidence/app-debug.badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" \
            | tee "$evidence/app-debug.permissions.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml \
            > "$evidence/app-debug.manifest.xmltree.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            | tee "$evidence/app-debug.apksigner.txt"
      - name: Upload non-final debug APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-acceptance-debug-apk
          path: artifacts/android-acceptance/
          if-no-files-found: error
          retention-days: 14

  api35-emulator-smoke:
    name: API 35 headless emulator smoke
    needs: android-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guardian-acceptance-debug-apk
          path: artifacts/android-acceptance
      - name: Install and create API 35 Google APIs AVD
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$avdmanager" create avd --force --name guardian-api35 \
            --package "system-images;android-35;google_apis;x86_64" --device "pixel_5"
      - name: Install and launch non-final debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/emulator
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" -avd guardian-api35 -no-window -no-audio \
            -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data \
            > artifacts/emulator/emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb shell input keyevent 82
          apk="artifacts/android-acceptance/app-debug.apk"
          test -s "$apk"
          adb install -r "$apk"
          adb shell am start -W -n com.guardian.family/.MainActivity
          adb shell pidof com.guardian.family
          adb logcat -d -t 500 > artifacts/emulator/logcat.txt
      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardian-api35-emulator-smoke
          path: artifacts/emulator/
          if-no-files-found: warn
          retention-days: 14
