name: openapi

on:
  push:
    paths:
      - "backend/**"
      - "packages/api-client/**"
      - "scripts/generate_openapi_client.py"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "packages/api-client/**"
      - "scripts/generate_openapi_client.py"
      - "pnpm-lock.yaml"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python scripts/generate_openapi_client.py
      - run: git diff --exit-code -- packages/api-client/src/generated.ts
